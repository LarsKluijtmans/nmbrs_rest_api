[build-system]
# hatchling >=1.27 is required for PEP 639 SPDX `license` / `license-files`.
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "nmbrs-rest-api"
dynamic = ["version"]
description = "Python SDK for the Nmbrs public REST API, with lazy-loading debtor, company and employee objects."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Lars Kluijtmans", email = "info@lk-software.com" }]
maintainers = [{ name = "Lars Kluijtmans", email = "info@lk-software.com" }]
keywords = ["nmbrs", "visma", "payroll", "hr", "rest", "api", "sdk"]

# PEP 639: no `License ::` classifiers - the SPDX expression above is authoritative.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Backend for the keyring-based TokenStore. See docs/authentication.md.
keyring = ["keyring>=25"]

dev = [
    "build>=1.2",
    "mypy>=1.11",
    "packaging>=24.0",
    "pytest>=8.0",
    "pyyaml>=6.0",          # tools/generate_scopes.py reads the vendored spec
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/LarsKluijtmans/nmbrs_rest_api"
Documentation = "https://github.com/LarsKluijtmans/nmbrs_rest_api/blob/main/DESIGN.md"
Source = "https://github.com/LarsKluijtmans/nmbrs_rest_api"
Issues = "https://github.com/LarsKluijtmans/nmbrs_rest_api/issues"
Changelog = "https://github.com/LarsKluijtmans/nmbrs_rest_api/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Version: derived from git tags, never hand-edited.
#
#   tag v0.1.0        -> 0.1.0
#   3 commits after   -> 0.1.1.dev3
#   no tags at all    -> 0.1.dev<N>
#
# `local_scheme = "no-local-version"` is LOAD-BEARING, not cosmetic. The default
# scheme appends a local segment (e.g. `+g1a2b3c4`), and PyPI/TestPyPI reject any
# upload whose version contains one. Staging publishes untagged commits, so
# without this the first TestPyPI run fails. CI asserts this invariant.
# ---------------------------------------------------------------------------
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/nmbrs_rest"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Ruff formats Python inside markdown fences. The docs use column-aligned trailing
# comments deliberately, so keep prose out of scope.
#
# _scopes.py is generated; excluding it stops ruff and the generator disagreeing,
# which would make `generate_scopes.py --check` fail in CI forever. mypy still
# type-checks it.
extend-exclude = ["*.md", "src/nmbrs_rest/_scopes.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
source = ["nmbrs_rest"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
