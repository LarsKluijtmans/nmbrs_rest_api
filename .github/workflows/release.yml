# Release
#
# One button. Actions -> Release -> Run workflow -> type the version.
#
#   validate  ->  build  ->  TestPyPI  ->  verify the staged artifact
#                                              |
#                                     [ you approve here ]
#                                              |
#                                          PyPI  ->  tag + GitHub Release
#
# Nothing is run locally and nothing is tagged up front. The version comes from the
# workflow input rather than from a tag, so a run that fails or is rejected leaves no
# tag behind to clean up; the tag is created only once PyPI has accepted the upload.
#
# The distribution is built exactly once. TestPyPI, the verification step and PyPI all
# consume that same artifact, so the thing that gets approved is the thing that ships.
#
# One-time setup is in docs/releasing.md: two GitHub Environments, `testpypi` and
# `pypi`, each holding one API token, with required reviewers on `pypi`.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (must be newer than PyPI's latest)"
        required: true
        type: string

permissions:
  contents: read

# Never two releases at once, and never cancel one midway: a half-finished upload is
# worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

env:
  DIST_NAME: nmbrs-rest-api
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: Validate version and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: python -m pip install --upgrade pip packaging

      - name: Tag must not already exist
        run: |
          tag="v${{ inputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. Releasing it again would move a tag people may already have."
            exit 1
          fi
          echo "OK: $tag is free"

      - name: Version is releasable, changelog is written
        # Writes the reviewer's summary: version, previous release, and the changelog
        # section. That summary is what the approval decision is made against.
        run: python tools/release_check.py preflight --version "${{ inputs.version }}"

  build:
    name: Build ${{ inputs.version }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: python -m pip install --upgrade pip build twine packaging

      - name: Build sdist and wheel
        # hatch-vcs normally derives the version from tags. There is no tag yet - that
        # is the point - so the requested version is pinned here instead.
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
        run: python -m build

      - name: twine check
        run: twine check --strict dist/*

      - name: Artifact really carries the requested version
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          from packaging.utils import parse_wheel_filename

          wanted = os.environ["WANTED"]
          wheel = next(Path("dist").glob("*.whl"))
          _, built, _, _ = parse_wheel_filename(wheel.name)
          print(f"requested {wanted}, built {built}")
          if str(built) != wanted:
              sys.exit(f"FAIL: asked for {wanted} but built {built}")
          print("OK")
          PY
        env:
          WANTED: ${{ inputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  staging:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/nmbrs-rest-api/
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          # A re-run of the same version would otherwise fail on a duplicate filename.
          # The `verify` job below checks the staged artifact is actually this build.
          skip-existing: true
          # Defaults to true but only works under Trusted Publishing; this uses tokens.
          attestations: false
          print-hash: true

  verify:
    name: Verify the staged artifact
    needs: [build, staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - run: python -m pip install --upgrade pip packaging

      - name: TestPyPI holds this build, not an older one
        run: |
          python tools/release_check.py staging-matches \
            --version "${{ inputs.version }}" \
            --wheel "$(ls dist/*.whl)"

      - name: Install from TestPyPI and run the checks
        # Same script used for manual staging checks. Installs into a clean venv from
        # the real index, so it exercises the published artifact rather than the repo.
        run: python scripts/try_testpypi.py --version "${{ inputs.version }}" --wait 180

  production:
    name: Publish to PyPI
    needs: [build, verify]
    runs-on: ubuntu-latest
    # Required reviewers on this environment are the approval gate. Everything before
    # it is reversible; this step is not.
    environment:
      name: pypi
      url: https://pypi.org/project/nmbrs-rest-api/
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # No skip-existing here on purpose: a duplicate on PyPI means something is
          # wrong and should stop the run loudly.
          attestations: false
          print-hash: true

  tag:
    name: Tag and publish the GitHub Release
    needs: [build, production]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create the tag
        # Deliberately after the upload. PyPI is the point of no return, so the tag
        # records what actually shipped rather than what was attempted.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

      - name: Summary
        run: |
          {
            echo "# Released ${{ inputs.version }}"
            echo
            echo "- PyPI: https://pypi.org/project/nmbrs-rest-api/${{ inputs.version }}/"
            echo "- Tag: \`v${{ inputs.version }}\`"
            echo
            echo '```bash'
            echo "pip install nmbrs-rest-api==${{ inputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
