# Release
#
# Two ways in, and they cannot cross over:
#
#   workflow_dispatch  ->  TestPyPI  (staging; any commit, any time)
#   push tag v*        ->  PyPI      (live; gated on manual approval)
#
# The distribution is built exactly once and both publish jobs consume that same
# artifact, so the thing that gets validated is the thing that gets uploaded.
#
# One-time setup is documented in docs/releasing.md. In short you need two GitHub
# Environments, `testpypi` and `pypi`, each holding one secret, with required
# reviewers enabled on `pypi`.

name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target (staging only; live releases are tag-driven)"
        type: choice
        options: [testpypi]
        default: testpypi
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never let two releases run at once, and never cancel one midway - a half-done
# upload is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Required: hatch-vcs reads tags to derive the version.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip build twine packaging

      - name: Build sdist and wheel
        run: python -m build

      - name: twine check
        run: twine check --strict dist/*

      - name: Extract and validate version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          from pathlib import Path
          from packaging.utils import parse_wheel_filename

          wheel = next(Path("dist").glob("*.whl"))
          _, version, _, _ = parse_wheel_filename(wheel.name)
          if version.local is not None:
              sys.exit(f"FAIL: version {version} has a local segment; PyPI rejects these.")
          print(f"version={version}")
          PY

      - name: Verify tag matches built version
        # Only meaningful on a tag push. Catches the classic failure where the tag
        # says v0.2.0 but the build produced something else (dirty tree, wrong
        # branch, missing tag fetch). Fail here rather than publish a mislabelled
        # release that can never be re-uploaded.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME}"
          expected="${tag#v}"
          actual="${{ steps.version.outputs.version }}"
          echo "tag=$tag expected=$expected actual=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag $tag implies version $expected but the build produced $actual."
            exit 1
          fi
          echo "OK: tag and built version agree"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI (staging)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/nmbrs-rest-api/
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          # Re-dispatching on the same commit produces the same version; without
          # this the second run fails on a duplicate filename.
          skip-existing: true
          # `attestations` defaults to true but only works under Trusted Publishing.
          # We authenticate with an API token, so it must be off.
          attestations: false
          print-hash: true

  publish-pypi:
    name: Publish to PyPI (live)
    needs: build
    # `github.event_name == 'push'` is not redundant: a workflow_dispatch can be
    # launched from a tag ref in the UI, which would otherwise satisfy the
    # startsWith() check and let a manual run reach live PyPI.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Enable "required reviewers" on this environment so a tag push pauses here
    # and waits for a human before anything reaches PyPI permanently.
    environment:
      name: pypi
      url: https://pypi.org/project/nmbrs-rest-api/
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # No skip-existing here on purpose: a duplicate version on PyPI means
          # something is wrong and should fail loudly. PyPI never allows reusing
          # a version number, even after deletion.
          attestations: false
          print-hash: true

  github-release:
    name: Create GitHub Release
    needs: [build, publish-pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
